[project]
name = "job-tracker-app"
version = "0.1.0"
description = "Multi-tenant, English-only job tracker — M1: core pipeline (CLI only)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
]
# M2+: fastapi, sqlalchemy[asyncio], alembic, asyncpg, jinja2, itsdangerous, apscheduler

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "cli*", "scheduler*"]
