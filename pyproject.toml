[project]
name = "jobfighter"
version = "0.1.0"
description = "JobFighter — multi-tenant, English-only job tracker. M2: web app + auth + DB"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "jinja2>=3.1.3",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "croniter>=2.0.5",
    "gitpython>=3.1.43",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo has no OS tz database to fall back on on Windows
]
# M4+: RQ+redis only if the M3 data shows the scheduling window actually overruns

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "cli*", "scheduler*", "apps*"]
